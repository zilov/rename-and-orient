name: Release

# On every push to main, publish a GitHub release for the pyproject version if
# it has none yet, with that version's CHANGELOG.md section as the notes, then
# upload the same version to PyPI so `pip install -U rename-and-orient` sees it.
#
# PyPI publishing is a job of this workflow rather than a separate `on: release`
# one: releases created with GITHUB_TOKEN do not trigger other workflows.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.created }}
    steps:
      - uses: actions/checkout@v4

      - name: Create release if version is new
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already released"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "No CHANGELOG.md section for $version" >&2
            exit 1
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md
          echo "created=true" >> "$GITHUB_OUTPUT"

  pypi:
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing (OIDC), no API token needed
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Build sdist and wheel
        run: uv build

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
