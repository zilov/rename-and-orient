[project]
name = "rename-and-orient"
version = "1.2.2"
description = "Rename and orient chromosomes based on reference alignment (PAF format)"
readme = "README.md"
authors = [
    { name = "dz11", email = "dz11@sanger.ac.uk" }
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
plots = ["matplotlib"]

[project.scripts]
rename-and-orient = "rename_and_orient.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
