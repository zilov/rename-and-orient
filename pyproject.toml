[project]
name = "rename-and-orient"
version = "1.3.0"
description = "Rename and orient chromosomes based on reference alignment (PAF format)"
readme = "README.md"
authors = [
    { name = "dz11", email = "dz11@sanger.ac.uk" }
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
plots = ["matplotlib"]

[project.scripts]
rename-and-orient = "rename_and_orient.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "matplotlib",
    "pytest>=9.1.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "D", "UP"]
ignore = ["D100", "D104", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]

[[tool.mypy.overrides]]
module = "matplotlib.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
